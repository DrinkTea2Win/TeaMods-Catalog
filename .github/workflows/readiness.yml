name: TeaMods deployment readiness

on:
  push:
    branches: [deployment/render-supabase-prep]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Build frontend
        working-directory: artifacts/tea-mods
        env:
          PORT: 4173
          BASE_PATH: /TeaMods-Catalog/
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_dGVzdC10ZWFtb2RzLmNsZXJrLmFjY291bnRzLmRldiQ
        run: pnpm run build
